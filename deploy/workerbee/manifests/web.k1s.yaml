apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: web
  namespace: content-tools-studio-dev-6b01ab0b06
  labels:
    workerbee.k1s.dev/project: content-tools-studio-dev-6b01ab0b06
spec:
  # Local image for WorkerBee. Build it with:
  # workerbee_v1_image_build tag=content-tools-studio:workerbee
  image: content-tools-studio:workerbee
  imagePullPolicy: Never
  replicas: 1
  env:
    - name: WORKERBEE_DEPLOY_REV
      value: external-audio-fade-v1
  ports:
    - name: http
      containerPort: 8080
  service:
    port: 8080
    targetPort: 8080
  health:
    readiness:
      httpGet: { path: /healthz, port: 8080 }
      initialDelaySeconds: 1
      periodSeconds: 2
  resources:
    requests:
      cpu: 0.5
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  ingress:
    host: app.content-tools-studio-dev-6b01ab0b06.workerbee.localhost
    path: /
