apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: web
  namespace: content-tools-studio-gpu-dev
  labels:
    workerbee.k1s.dev/project: content-tools-studio-gpu-dev
    workerbee.k1s.dev/deploy-target: remote-core-proxy-gpu
spec:
  # Remote k1s GPU variant for the MicroK8s dev cluster.
  # Build and push this image before staging/deploying:
  # docker build -t reg.microk8s.core.home.arpa:32000/content-tools-studio:nvenc-smoke .
  # docker push reg.microk8s.core.home.arpa:32000/content-tools-studio:nvenc-smoke
  image: reg.microk8s.core.home.arpa:32000/content-tools-studio:nvenc-smoke
  imagePullPolicy: Always
  replicas: 1
  runtimeClassName: nvidia
  nodeSelector:
    site: host-b
    gpu.present: "true"
  env:
    - name: WORKERBEE_DEPLOY_REV
      value: remote-core-proxy-gpu-nvenc-smoke-v1
    - name: WORKSPACE_ROOT
      value: /data/workspace
    - name: NVIDIA_VISIBLE_DEVICES
      value: all
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility,video
  ports:
    - name: http
      containerPort: 8080
  service:
    # Host B's core-proxy edge gateway forwards site traffic to 192.168.29.111:8081.
    port: 8081
    targetPort: 8080
  health:
    readiness:
      httpGet: { path: /healthz, port: 8080 }
      initialDelaySeconds: 1
      periodSeconds: 2
  resources:
    requests:
      cpu: 0.5
      memory: 1Gi
      nvidia.com/gpu: 1
    limits:
      cpu: 2
      memory: 8Gi
      nvidia.com/gpu: 1
  storage:
    - name: workspace
      mountPath: /data/workspace
      retention: Retain
      size: 20Gi
  ingress:
    host: content-tools-studio.apps.k1s-dev-a.core.home.arpa
    path: /
